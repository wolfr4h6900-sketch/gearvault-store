<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GEARVAULT | Premium Car Posters</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(12,12,12,.96);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #292929;
    padding:17px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:26px;
    font-weight:900;
    letter-spacing:4px;
}

nav button{
    background:none;
    border:0;
    color:#fff;
    cursor:pointer;
    font-size:15px;
    margin-left:15px;
}

.cart-btn{
    background:#fff !important;
    color:#000 !important;
    padding:10px 17px;
    border-radius:7px;
    font-weight:bold;
}

/* HERO */

.hero{
    min-height:78vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 20px;

    background:
    radial-gradient(circle at center,#383838 0,#151515 30%,#050505 75%);
}

.hero-content{
    max-width:900px;
}

.hero h1{
    font-size:clamp(48px,9vw,100px);
    letter-spacing:9px;
    font-weight:900;
}

.hero p{
    color:#aaa;
    font-size:19px;
    margin:20px 0 32px;
}

.shop-btn{
    display:inline-block;
    background:#fff;
    color:#000;
    text-decoration:none;
    padding:15px 32px;
    border-radius:7px;
    font-weight:900;
    transition:.2s;
}

.shop-btn:hover{
    transform:scale(1.05);
}

/* SECTIONS */

.section{
    padding:75px 6%;
}

.section h2{
    text-align:center;
    font-size:36px;
    margin-bottom:45px;
    letter-spacing:2px;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:28px;
}

.product{
    background:#141414;
    border:1px solid #292929;
    border-radius:14px;
    overflow:hidden;
    transition:.25s;
}

.product:hover{
    transform:translateY(-7px);
    border-color:#666;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.product-image{
    width:100%;
    height:300px;
    object-fit:cover;
    cursor:pointer;
    background:#222;
    display:block;
}

.product-info{
    padding:19px;
}

.product h3{
    font-size:20px;
    margin-bottom:8px;
}

.price{
    color:#bbb;
    font-size:17px;
    margin-bottom:16px;
}

.add{
    width:100%;
    padding:13px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-weight:900;
    background:#fff;
    color:#000;
    transition:.2s;
}

.add:hover{
    background:#ddd;
}

/* CART */

#cart{
    display:none;
    min-height:75vh;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:20px 0;
    border-bottom:1px solid #292929;
}

.cart-name{
    font-weight:bold;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
}

.qty button{
    padding:7px 12px;
    border:0;
    cursor:pointer;
    border-radius:5px;
}

.remove{
    background:#333;
    color:#fff;
    border:0;
    padding:9px 13px;
    cursor:pointer;
    border-radius:5px;
}

.total{
    text-align:right;
    font-size:26px;
    font-weight:bold;
    margin-top:30px;
}

.whatsapp{
    display:block;
    margin:25px 0 0 auto;
    width:max-content;
    background:#fff;
    color:#000;
    padding:14px 22px;
    text-decoration:none;
    border-radius:7px;
    font-weight:bold;
}

/* IMAGE GALLERY */

.gallery{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.94);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.gallery-box{
    width:min(900px,95vw);
    position:relative;
    text-align:center;
}

.gallery-image{
    max-width:100%;
    max-height:75vh;
    object-fit:contain;
    border-radius:10px;
    display:block;
    margin:auto;
}

.close-gallery{
    position:absolute;
    top:-45px;
    right:0;
    background:#fff;
    color:#000;
    border:0;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.gallery-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#000;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
}

.gallery-left{
    left:10px;
}

.gallery-right{
    right:10px;
}

.gallery-title{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}

.gallery-counter{
    color:#aaa;
    margin-top:7px;
}

/* FOOTER */

footer{
    padding:35px;
    text-align:center;
    color:#777;
    border-top:1px solid #222;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:15px 4%;
    }

    .logo{
        font-size:20px;
        letter-spacing:2px;
    }

    nav button{
        font-size:13px;
        margin-left:6px;
    }

    .hero{
        min-height:65vh;
    }

    .hero h1{
        letter-spacing:5px;
    }

    .section{
        padding:55px 5%;
    }

    .product-image{
        height:280px;
    }

    .cart-item{
        flex-wrap:wrap;
    }

    .gallery-arrow{
        width:40px;
        height:40px;
        font-size:22px;
    }

}

</style>
</head>

<body>


<!-- HEADER -->

<header>

    <div class="https://github.com/wolfr4h6900-sketch/gearvault-store/blob/main/50a97454-c078-4440-9130-d0d369423896.png?raw=true">
        GEARVAULT
    </div>

    <nav>

        <button onclick="showHome()">
            HOME
        </button>

        <button onclick="showShop()">
            SHOP
        </button>

        <button onclick="showCart()" class="cart-btn">
            🛒 CART <span id="cartCount">0</span>
        </button>

    </nav>

</header>


<main>


<!-- HOME -->

<section class="hero" id="home">

    <div class="hero-content">

        <h1>GEARVAULT</h1>

        <p>
            PREMIUM AUTOMOTIVE POSTERS
        </p>

        <a
            href="#shop"
            class="shop-btn"
            onclick="showShop()"
        >
            SHOP NOW
        </a>

    </div>

</section>


<!-- SHOP -->

<section class="section" id="shop">

    <h2>
        CAR POSTERS
    </h2>


    <div class="products">


        <!-- BMW -->

        <div class="product">

            <img
                class="product-image"
                src="https://github.com/wolfr4h6900-sketch/gearvault-store/blob/main/Screenshot%202026-09-22%20225127.png?raw=true"
                onclick="openGallery('Car Theme Wall Poster Set of 27 | 3 Large 12×18 Inch + 24 Small 4.5×6 Inch Posters | Unframed Car Wall Decor | With Double-Sided Tape Paper Print (6 inch X 4.5 inch, Rolled)')"
            >

            <div class="product-info">

                <h3>
                Performance Edition — 27-Piece Wall Poster Set
                </h3>

                <div class="price">
                    ₹499
                </div>

                <button
                    class="add"
                    onclick="addToCart('Performance Edition — 27-Piece Wall Poster Set',499)"
                >
                    ADD TO CART
                </button>

            </div>

        </div>


        <!-- SUPERCAR -->

        <div class="product">

            <img
                class="product-image"
                src="https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=900&q=90"
                onclick="openGallery('Supercar Edition')"
            >

            <div class="product-info">

                <h3>
                    Supercar Edition
                </h3>

                <div class="price">
                    ₹300
                </div>

                <button
                    class="add"
                    onclick="addToCart('Supercar Edition',300)"
                >
                    ADD TO CART
                </button>

            </div>

        </div>


        <!-- JDM -->

        <div class="product">

            <img
                class="product-image"
                src="https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=900&q=90"
                onclick="openGallery('JDM Collection')"
            >

            <div class="product-info">

                <h3>
                    JDM Collection
                </h3>

                <div class="price">
                    ₹350
                </div>

                <button
                    class="add"
                    onclick="addToCart('JDM Collection',350)"
                >
                    ADD TO CART
                </button>

            </div>

        </div>


        <!-- MERCEDES -->

        <div class="product">

            <img
                class="product-image"
                src="https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=900&q=90"
                onclick="openGallery('Mercedes Edition')"
            >

            <div class="product-info">

                <h3>
                    Mercedes Edition
                </h3>

                <div class="price">
                    ₹400
                </div>

                <button
                    class="add"
                    onclick="addToCart('Mercedes Edition',400)"
                >
                    ADD TO CART
                </button>

            </div>

        </div>


    </div>

</section>


<!-- CART -->

<section class="section" id="cart">

    <h2>
        YOUR CART 🛒
    </h2>

    <div id="cartItems"></div>

    <div class="total">

        Total: ₹<span id="cartTotal">0</span>

    </div>

    <a
        id="whatsappOrder"
        class="whatsapp"
        href="#"
        target="_blank"
    >
        ORDER ON WHATSAPP
    </a>

</section>


</main>


<!-- IMAGE GALLERY -->

<div
    class="gallery"
    id="gallery"
    onclick="closeGalleryOutside(event)"
>

    <div class="gallery-box">

        <button
            class="close-gallery"
            onclick="closeGallery()"
        >
            ×
        </button>

        <button
            class="gallery-arrow gallery-left"
            onclick="previousImage()"
        >
            ‹
        </button>

        <img
            id="galleryImage"
            class="gallery-image"
        >

        <button
            class="gallery-arrow gallery-right"
            onclick="nextImage()"
        >
            ›
        </button>

        <div
            id="galleryTitle"
            class="gallery-title"
        ></div>

        <div
            id="galleryCounter"
            class="gallery-counter"
        ></div>

    </div>

</div>


<footer>

    © 2026 GEARVAULT — Automotive Culture

</footer>


<script>


/* =========================
   CART
========================= */

let cart =
JSON.parse(localStorage.getItem("gearvaultCart")) || [];


function saveCart(){

    localStorage.setItem(
        "gearvaultCart",
        JSON.stringify(cart)
    );

}


function addToCart(name,price){

    let existing =
        cart.find(item => item.name === name);


    if(existing){

        existing.qty++;

    }else{

        cart.push({

            name:name,
            price:price,
            qty:1

        });

    }


    saveCart();

    updateCartCount();

    alert(name + " added to cart!");

}


function updateCartCount(){

    let count =
        cart.reduce(
            (total,item) =>
            total + item.qty,
            0
        );


    document.getElementById(
        "cartCount"
    ).innerText = count;

}


/* =========================
   NAVIGATION
========================= */

function showHome(){

    document.getElementById("shop").style.display="block";

    document.getElementById("cart").style.display="none";

    document.getElementById("home").scrollIntoView({
        behavior:"smooth"
    });

}


function showShop(){

    document.getElementById("shop").style.display="block";

    document.getElementById("cart").style.display="none";

    document.getElementById("shop").scrollIntoView({
        behavior:"smooth"
    });

}


function showCart(){

    document.getElementById("shop").style.display="none";

    document.getElementById("cart").style.display="block";

    renderCart();

    document.getElementById("cart").scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================
   CART DISPLAY
========================= */

function renderCart(){

    let container =
        document.getElementById("cartItems");


    container.innerHTML="";


    let total=0;


    if(cart.length===0){

        container.innerHTML=
        "<p style='text-align:center;color:#888;padding:40px'>Your cart is empty.</p>";

    }


    cart.forEach((item,index)=>{

        total += item.price * item.qty;


        container.innerHTML += `

        <div class="cart-item">

            <div>

                <div class="cart-name">
                    ${item.name}
                </div>

                <div style="color:#aaa;margin-top:6px">
                    ₹${item.price} × ${item.qty}
                </div>

            </div>


            <div class="qty">

                <button
                    onclick="changeQty(${index},-1)"
                >
                    −
                </button>

                <span>
                    ${item.qty}
                </span>

                <button
                    onclick="changeQty(${index},1)"
                >
                    +
                </button>

            </div>


            <button
                class="remove"
                onclick="removeItem(${index})"
            >
                REMOVE
            </button>

        </div>

        `;

    });


    document.getElementById(
        "cartTotal"
    ).innerText=total;


    createWhatsAppLink();

}


function changeQty(index,amount){

    cart[index].qty += amount;


    if(cart[index].qty <= 0){

        cart.splice(index,1);

    }


    saveCart();

    updateCartCount();

    renderCart();

}


function removeItem(index){

    cart.splice(index,1);

    saveCart();

    updateCartCount();

    renderCart();

}


/* =========================
   WHATSAPP ORDER
========================= */

function createWhatsAppLink(){

    let message =
        "Hello GEARVAULT!%0A%0AI want to order:%0A";


    cart.forEach(item=>{

        message +=
            item.name +
            " × " +
            item.qty +
            " = ₹" +
            (item.price * item.qty) +
            "%0A";

    });


    let total =
        cart.reduce(
            (sum,item) =>
            sum + (item.price * item.qty),
            0
        );


    message +=
        "%0ATotal: ₹" + total;


    /* YOUR WHATSAPP NUMBER */

    let phone =
        "916207273731";


    document.getElementById(
        "whatsappOrder"
    ).href =
        "https://wa.me/" +
        phone +
        "?text=" +
        message;

}


/* =========================
   PRODUCT IMAGE GALLERIES
========================= */

const productImages = {

    "Performance Edition — 27-Piece Wall Poster Set":[

        "Screenshot 2026-09-22 224637.png",

        "Screenshot 2026-09-22 224628.png",

        "Screenshot 2026-09-22 224655.png",

    

    ],


    "Supercar Edition":[

        "https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=1200&q=90",

        "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1200&q=90"

    ],


    "JDM Collection":[

        "https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=1200&q=90",

        "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=1200&q=90"

    ],


    "Mercedes Edition":[

        "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=1200&q=90",

        "https://images.unsplash.com/photo-1618843479165-4c8e0e5b1f5d?auto=format&fit=crop&w=1200&q=90"

    ]

};


let currentProduct = "";

let currentImage = 0;


function openGallery(product){

    currentProduct = product;

    currentImage = 0;

    document.getElementById(
        "gallery"
    ).style.display="flex";


    showGalleryImage();

}


function showGalleryImage(){

    let images =
        productImages[currentProduct];


    document.getElementById(
        "galleryImage"
    ).src =
        images[currentImage];


    document.getElementById(
        "galleryTitle"
    ).innerText =
        currentProduct;


    document.getElementById(
        "galleryCounter"
    ).innerText =
        (currentImage + 1) +
        " / " +
        images.length;

}


function nextImage(){

    let images =
        productImages[currentProduct];


    currentImage++;


    if(currentImage >= images.length){

        currentImage = 0;

    }


    showGalleryImage();

}


function previousImage(){

    let images =
        productImages[currentProduct];


    currentImage--;


    if(currentImage < 0){

        currentImage =
            images.length - 1;

    }


    showGalleryImage();

}


function closeGallery(){

    document.getElementById(
        "gallery"
    ).style.display="none";

}


function closeGalleryOutside(event){

    if(event.target.id === "gallery"){

        closeGallery();

    }

}


/* KEYBOARD CONTROLS */

document.addEventListener(
    "keydown",
    function(event){

        let gallery =
            document.getElementById("gallery");


        if(gallery.style.display === "flex"){

            if(event.key === "ArrowRight"){

                nextImage();

            }

            if(event.key === "ArrowLeft"){

                previousImage();

            }

            if(event.key === "Escape"){

                closeGallery();

            }

        }

    }
);


/* START */

updateCartCount();

</script>

</body>
</html>
